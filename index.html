<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirthiii ❤️ Lokiiii Dino Love Game</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    background:#0f172a;
}

canvas{
    display:block;
    margin:auto;
    background:linear-gradient(to bottom,#111827,#1f2937);
    border-bottom:5px solid white;
}

#score{
    position:absolute;
    top:20px;
    right:30px;
    color:white;
    font-size:28px;
    font-weight:bold;
}

#messageBox{
    position:absolute;
    top:20px;
    left:20px;
    color:pink;
    font-size:22px;
    font-weight:bold;
}

#popup{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:750px;
    background:white;
    border-radius:25px;
    padding:30px;
    text-align:center;
    z-index:999;
    box-shadow:0 0 40px rgba(255,105,180,0.8);
}

#popup h1{
    color:#ff2d75;
    margin-bottom:15px;
    font-size:38px;
}

#popup p{
    font-size:20px;
    margin-bottom:20px;
    color:#444;
}

.gallery{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.gallery img{
    width:180px;
    height:230px;
    object-fit:cover;
    border-radius:15px;
    border:4px solid pink;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
    transition:0.4s;
}

.gallery img:nth-child(1){
    transform:rotate(-5deg);
}

.gallery img:nth-child(2){
    transform:rotate(4deg);
}

.gallery img:nth-child(3){
    transform:rotate(-3deg);
}

.gallery img:hover{
    transform:scale(1.05);
}

.btn{
    padding:15px 30px;
    border:none;
    border-radius:50px;
    font-size:20px;
    cursor:pointer;
    margin:10px;
    font-weight:bold;
}

#yesBtn{
    background:#ff2d75;
    color:white;
}

#noBtn{
    background:#d1d5db;
    position:relative;
}

#resultMessage{
    margin-top:25px;
    font-size:28px;
    color:#ff2d75;
    font-weight:bold;
    line-height:1.5;
}

.heart{
    position:absolute;
    font-size:25px;
    animation:fall linear forwards;
    pointer-events:none;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
        opacity:1;
    }
    to{
        transform:translateY(1000px);
        opacity:0;
    }
}

#credits{
    position:fixed;
    bottom:20px;
    width:100%;
    text-align:center;
    color:white;
    font-size:18px;
    display:none;
}

</style>
</head>

<body>

<div id="score">Score: 0</div>

<div id="messageBox">
🦖 Kirthiii ❤️ Lokiiii Forever Story
</div>

<canvas id="gameCanvas" width="1100" height="450"></canvas>

<div id="popup">

<h1>Lokiiii... Will You Be Mine Forever? 🌹💖</h1>

<div class="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
</div>

<p>
Can we always be this close forever and ever? ❤️
</p>

<button class="btn" id="yesBtn">YES 💍</button>
<button class="btn" id="noBtn">NO 😒</button>

<div id="resultMessage"></div>

</div>

<div id="credits">
🎬 Lead Dinosaur: Kirthiii 🦖 <br>
❤️ Future Boyfriend: Lokiiii <br>
💍 To Be Continued... At Our Wedding
</div>

<!-- SONG -->
<audio id="loveSong" src="song.mp3"></audio>

<!-- VOICE NOTE -->
<audio id="voiceNote" src="voice.mp3"></audio>

<script>

const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

let score=0;
let gameOver=false;
let speed=8;

const FINAL_SCORE = 190225;

const dino={
    x:80,
    y:300,
    width:50,
    height:50,
    velocityY:0,
    gravity:0.9,
    jumping:false
};

const obstacles=[];

function createObstacle(){

    obstacles.push({
        x:canvas.width,
        y:320,
        width:30,
        height:50
    });

}

setInterval(()=>{

    if(!gameOver && score < FINAL_SCORE){
        createObstacle();
    }

},1400);

function drawMoon(){

    ctx.beginPath();
    ctx.arc(980,70,35,0,Math.PI*2);
    ctx.fillStyle='#fef08a';
    ctx.fill();

}

function drawStars(){

    for(let i=0;i<70;i++){

        ctx.fillStyle='white';

        ctx.fillRect(
            Math.random()*canvas.width,
            Math.random()*180,
            2,
            2
        );

    }

}

function drawGround(){

    ctx.strokeStyle='white';

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(0,380);

    ctx.lineTo(canvas.width,380);

    ctx.stroke();

}

function drawDino(){

    ctx.font='42px Arial';

    ctx.fillText('🦖',dino.x,dino.y+40);

}

function drawObstacles(){

    ctx.font='40px Arial';

    obstacles.forEach(obstacle=>{

        ctx.fillText('🌵',obstacle.x,obstacle.y+40);

        obstacle.x -= speed;

    });

}

function collision(obstacle){

    return(

        dino.x < obstacle.x + obstacle.width &&
        dino.x + dino.width > obstacle.x &&
        dino.y < obstacle.y + obstacle.height &&
        dino.y + dino.height > obstacle.y

    );

}

function updateDialogue(){

    const msg=document.getElementById('messageBox');

    if(score >= 50000 && score < 100000){

        msg.innerHTML='💖 Lokiiii... you make my world brighter';

    }

    if(score >= 100000 && score < 150000){

        msg.innerHTML='🦖 Still running toward you, Lokiiii';

    }

    if(score >= 150000 && score < FINAL_SCORE){

        msg.innerHTML='❤️ Almost there, my Lokiiii...';

    }

}

function createHeart(){

    const heart=document.createElement('div');

    heart.classList.add('heart');

    heart.innerHTML='💖';

    heart.style.left=Math.random()*window.innerWidth+'px';

    heart.style.animationDuration=(Math.random()*3+2)+'s';

    document.body.appendChild(heart);

    setTimeout(()=>{

        heart.remove();

    },5000);

}

function startHeartRain(){

    setInterval(createHeart,120);

}

function update(){

    if(gameOver) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawMoon();

    drawStars();

    drawGround();

    drawDino();

    drawObstacles();

    dino.velocityY += dino.gravity;

    dino.y += dino.velocityY;

    if(dino.y >= 300){

        dino.y=300;

        dino.jumping=false;

    }

    obstacles.forEach((obstacle,index)=>{

        if(collision(obstacle)){

            realGameOver();

        }

        if(obstacle.x + obstacle.width < 0){

            obstacles.splice(index,1);

            score += 225;

            if(score > FINAL_SCORE){

                score=FINAL_SCORE;

            }

            document.getElementById('score').innerHTML='Score: '+score;

            updateDialogue();

            speed += 0.01;

        }

    });

    if(score >= FINAL_SCORE){

        romanticEnding();

        return;

    }

    requestAnimationFrame(update);

}

function jump(){

    if(!dino.jumping){

        dino.velocityY=-16;

        dino.jumping=true;

    }

}

document.addEventListener('keydown',e=>{

    if(e.code==='Space' || e.code==='ArrowUp'){

        jump();

    }

});

document.addEventListener('click',jump);

function realGameOver(){

    gameOver=true;

    ctx.fillStyle='rgba(0,0,0,0.7)';

    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.font='55px Arial';

    ctx.fillStyle='white';

    ctx.fillText('GAME OVER 💔',330,180);

    ctx.font='30px Arial';

    ctx.fillStyle='pink';

    ctx.fillText(
        'Lokiiii... you should have protected Kirthiii 🥺',
        160,
        250
    );

    ctx.font='24px Arial';

    ctx.fillStyle='white';

    ctx.fillText(
        'Refresh the page and try again ❤️',
        320,
        320
    );

}

function romanticEnding(){

    gameOver=true;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawMoon();

    ctx.font='70px Arial';

    ctx.fillText('🦖',320,280);

    ctx.fillText('🦕',700,280);

    ctx.fillText('🌹',540,260);

    ctx.font='42px Arial';

    ctx.fillStyle='pink';

    ctx.fillText('190225 ❤️ LOVE UNLOCKED',250,120);

    ctx.font='28px Arial';

    ctx.fillText(
        '🦖 Kirthiii Dino finally found her Lokiiii 🌹',
        220,
        180
    );

    startHeartRain();

    const song=document.getElementById('loveSong');

    // Increase volume slowly at final score
    function increaseVolume(){

        let volume=0.08;

        const fade=setInterval(()=>{

            if(volume < 1){

                volume += 0.05;

                song.volume=volume;

            }else{

                clearInterval(fade);

            }

        },300);

    }

    increaseVolume();

}

const noBtn=document.getElementById('noBtn');

const funnyTexts=[
'Nice Try 😂',
'System Error 😭',
'Only YES Allowed 😌',
'Illegal Move 🚫',
'Are You Sure? 🥺'
];

noBtn.addEventListener('mouseover',()=>{

    noBtn.innerText=
    funnyTexts[Math.floor(Math.random()*funnyTexts.length)];

    noBtn.style.position='absolute';

    noBtn.style.left=Math.random()*400+'px';

    noBtn.style.top=Math.random()*300+'px';

});

document.getElementById('yesBtn').addEventListener('click',()=>{

    const song=document.getElementById('loveSong');

    // Jump to "You're my my my..." line
    song.currentTime=125;

    // Full emotional volume
    song.volume=1;

    song.play();

    document.getElementById('voiceNote').play();

    // SHOW PHOTOS ONLY AFTER YES
    document.getElementById('popup').style.display='block';

    document.getElementById('resultMessage').innerHTML=`
    💍 Then y wait, Lokiiii... marry me soon ❤️ <br><br>
    Mission Accepted: Kirthiii ❤️ Lokiiii Forever
    `;

    document.getElementById('credits').style.display='block';

});

// SONG STARTS FROM BEGINNING OF GAME
const bgSong=document.getElementById('loveSong');

bgSong.volume=0.08;

bgSong.play();

update();

</script>

</body>
</html>
